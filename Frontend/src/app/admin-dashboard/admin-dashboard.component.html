<app-navbar></app-navbar>

<div class="admin-dashboard container mt-4">
  <h1 class="mb-4 text-center">Admin Dashboard</h1>

  <!-- Pending Entities Section -->
  <h2 class="mb-3">Entidades Pendentes</h2>
  <div *ngIf="loading" class="text-center">
    <div class="spinner-border" role="status">
      <span class="sr-only">Loading...</span>
    </div>
  </div>
  <ul *ngIf="!loading" class="list-group mb-4">
    <li *ngFor="let entity of pendingEntities" class="list-group-item">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-1">{{ entity.name }}</h5>
          <p class="mb-1">{{ entity.description }}</p>
        </div>
        <div>
          <button class="btn btn-success mr-2" (click)="acceptEntity(entity)">
            Aceitar
          </button>
          <button class="btn btn-danger" (click)="rejectEntity(entity)">
            Rejeitar
          </button>
        </div>
      </div>
    </li>
  </ul>

  <!-- Charts Section -->
  <div class="charts-container row">
    <div class="chart col-md-4">
      <h2 class="h5 mb-3 text-center">Média de Kg por Doação</h2>
      <canvas id="avgKgPerDonationChart"></canvas>
    </div>
    <div class="chart col-md-4">
      <h2 class="h5 mb-3 text-center">Doações por Distrito</h2>
      <canvas id="donationsPerDistrictChart"></canvas>
    </div>
    <div class="chart col-md-4">
      <h2 class="h5 mb-3 text-center">Tipos de Roupa </h2>
      <canvas id="clothingTypesPieChart"></canvas>
    </div>
  </div>
</div>
