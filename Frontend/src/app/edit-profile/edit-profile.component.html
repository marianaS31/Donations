<app-navbar></app-navbar>
<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <h1 class="card-title">Edit Profile</h1>
    </div>
    <div class="card-body">
      <form #form="ngForm" (ngSubmit)="saveDonorProfile(form)">
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            class="form-control"
            id="email"
            [(ngModel)]="donor.email"
            name="email"
            required
          />
        </div>
        <div class="form-group">
          <label for="name">Name:</label>
          <input
            type="text"
            class="form-control"
            id="name"
            [(ngModel)]="donor.name"
            name="name"
            required
          />
        </div>
        <div class="form-group">
          <label for="lname">Last Name:</label>
          <input
            type="text"
            class="form-control"
            id="lname"
            [(ngModel)]="donor.lname"
            name="lname"
            required
          />
        </div>
        <div class="form-group">
          <label for="psw">Password:</label>
          <input
            type="password"
            class="form-control"
            id="psw"
            [(ngModel)]="donor.psw"
            name="psw"
          />
        </div>
        <div class="form-group">
          <label for="pswrepeat">Repeat Password:</label>
          <input
            type="password"
            class="form-control"
            id="pswrepeat"
            [(ngModel)]="donor.pswrepeat"
            name="pswrepeat"
          />
        </div>
        <button type="submit" class="btn btn-primary">Update Profile</button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          Cancel
        </button>
      </form>
      <div *ngIf="errors.length > 0" class="mt-3">
        <div class="alert alert-danger" *ngFor="let error of errors">
          {{ error }}
        </div>
      </div>
    </div>
  </div>
</div>
